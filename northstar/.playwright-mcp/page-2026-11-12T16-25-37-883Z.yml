            - heading "Who is answering" [level=4] [ref=e567]
            - paragraph [ref=e568]: Name the assistant in the header and say what it knows, such as Answers from the NorthStar docs. Never present a model as a person.
            - heading "Thinking" [level=4] [ref=e569]
            - paragraph [ref=e570]: Show the three-dot indicator until the first words arrive, then stream the reply into the same bubble.
            - heading "Errors" [level=4] [ref=e571]
            - paragraph [ref=e572]: Put a failed request in the log as an error message with a way to retry. Do not clear what the user typed.
            - heading "When to use" [level=3] [ref=e573]
            - list [ref=e574]:
              - listitem [ref=e575]: Use for an assistant that answers open questions in plain language.
              - listitem [ref=e576]: Use for support threads where both sides write turns.
              - listitem [ref=e577]: Offer two to four suggestions in the empty state so users know what to ask.
            - heading "When not to use" [level=3] [ref=e578]
            - list [ref=e579]:
              - listitem [ref=e580]: Do not use for a single command or search. Use the command palette.
              - listitem [ref=e581]: Do not use for system status. Use a notification or alert.
              - listitem [ref=e582]: Do not hide that the answers are generated.
