<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>Radial hub | NorthStar dashboard layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/dashboards.css">
<style>

  .rh { display: grid; grid-template-columns: 1fr 484px 1fr; grid-template-rows: 1fr 1fr; gap: 16px; min-height: 0; }
  .core { grid-column: 2; grid-row: 1 / 3; display: grid; place-items: center; position: relative; border-radius: 28px; overflow: hidden; }
  .rh .t .d-lg { font-size: 52px; }

</style>
</head>
<body>
<div class="art" id="a"></div>
<script src="../js/dashboards.js"></script>
<script>
const D = NS.dash;

const s = D.shell({ active: "pulse", title: "Operating Health", sub: "ONE VIEW OF THE WHOLE BUSINESS  /  LIVE  /  OCT 22", right: D.live("Updated 9:41") });
a.innerHTML = s.open + `<div class="rh">
  <section class="t t--ink" style="grid-column:1;grid-row:1"><div class="o">Revenue</div><div class="row row--b" style="gap:12px"><div class="d-lg num">$48.2M</div><span class="dl" style="padding-bottom:8px">+11% vs plan</span></div><div class="sp1" style="display:flex;align-items:flex-end">${D.area({ w: 400, h: 190, ticks: 3, min: 30, max: 50, fmt: v => "$" + Math.round(v) + "M", labels: ["Jul","Aug","Sep","Oct"], sets: [{ data: D.series(16, 36, 48, .06, 4), color: "var(--ns-teal-500)", sw: 2.6 }] })}</div></section>
  <section class="t t--ink" style="grid-column:3;grid-row:1"><div class="o">Customers</div><div class="row row--b" style="gap:12px"><div class="d-lg num">14,206</div><span class="cap" style="padding-bottom:8px">+412 net this month</span></div><div class="sp1" style="display:flex;align-items:flex-end">${D.bars({ w: 400, h: 190, data: D.series(12, 60, 92, .1, 6), color: "var(--ns-viz-4)", hi: 11, hiColor: "var(--ns-teal-500)", gap: 8, r: 4, labels: ["N","D","J","F","M","A","M","J","J","A","S","O"], pad: [4, 0, 20, 0] })}</div></section>
  <section class="t core" style="background:var(--ns-widget-bg)">
    <div style="position:absolute;inset:0;display:grid;place-items:center">${D.rings({ size: 440, stroke: 18, gap: 12, items: [{ pct: 88, color: "var(--ns-teal-500)" }, { pct: 72, color: "var(--ns-blue-500)" }, { pct: 61, color: "var(--ns-purple-500)" }, { pct: 47, color: "var(--ns-viz-3)" }] })}</div>
    <div style="position:relative;text-align:center;display:grid;gap:6px"><div class="o" style="justify-content:center">Health index</div><div class="d-xxl num" style="font-size:104px">84</div><span class="dl" style="justify-content:center">Up 3 this week</span></div>
    <div class="lg" style="position:absolute;bottom:22px;left:0;right:0;justify-content:center"><span><i style="--_c:var(--ns-teal-500)"></i>Revenue</span><span><i style="--_c:var(--ns-blue-500)"></i>Delivery</span><span><i style="--_c:var(--ns-purple-500)"></i>Customers</span><span><i style="--_c:var(--ns-viz-3)"></i>Support</span></div>
  </section>
  <section class="t" style="grid-column:1;grid-row:2"><div class="o">Delivery on time</div><div class="row row--b" style="gap:12px"><div class="d-lg num" style="color:var(--ns-teal-500)">96%</div><span class="cap" style="padding-bottom:8px">Target 95%</span></div><div class="sp1"></div>${D.heat({ rows: 4, cols: 21, cell: 16, ch: 28, gap: 4, seed: 33, color: "var(--ns-viz-1)", fn: (x, y, r) => .55 + r() * .45 })}<div class="cap">Last 12 weeks by region, darker is better.</div></section>
  <section class="t" style="grid-column:3;grid-row:2"><div class="o">Support, median reply</div><div class="row row--b" style="gap:12px"><div class="d-lg num">2.4 h</div><span class="dl" style="padding-bottom:8px">0.7 h faster</span></div><div class="sp1" style="display:flex;align-items:flex-end">${D.area({ w: 400, h: 190, ticks: 3, min: 2, max: 3.4, fmt: v => v.toFixed(1) + "h", labels: ["Jul","Aug","Sep","Oct"], sets: [{ data: D.series(14, 3.1, 2.4, .07, 9), color: "var(--ns-viz-2)", sw: 2.6 }] })}</div></section>
</div>` + s.close;

</script>
</body>
</html>
