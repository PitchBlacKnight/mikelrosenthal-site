<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>Stage 5, contract | NorthStar dashboard layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/dashboards.css">
<style>
  .g { grid-template-columns: repeat(12, 1fr); grid-template-rows: 96px 1fr 1fr; }
  .spine { grid-column: 1 / 13; }
  .cv { grid-column: 1 / 4; } .sl { grid-column: 4 / 7; } .bl { grid-column: 7 / 10; } .dp { grid-column: 1 / 7; } .rm { grid-column: 7 / 10; }
  .gt { display: grid; grid-template-columns: 120px repeat(4, 1fr); align-items: center; font: 600 12px/1 var(--ns-font-sans); } .gt .m { font: 700 10px/1 var(--ns-font-sans); letter-spacing: 1px; color: var(--ns-widget-muted); padding: 0 0 8px 6px; border-left: 1px solid var(--ns-widget-grid); }
  .gt .n { padding: 11px 0; } .gt .l { grid-column: 2 / 6; position: relative; height: 22px; border-radius: 6px; background: var(--ns-widget-track); } .gt .l i { position: absolute; top: 0; bottom: 0; border-radius: 6px; left: var(--_s); width: var(--_w); background: var(--_c); }
  .gt .l i + i { box-shadow: -2px 0 0 var(--ns-widget-track); }
  .iv { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--ns-widget-grid); font: 400 13px/17px var(--ns-font-sans); } .iv:last-child { border: 0; }

</style>
</head>
<body>
<div class="art" id="a"></div>
<script src="../js/dashboards.js"></script>
<script>
const D = NS.dash;

const s = D.shell({ active: "grid", title: "Deal flow", sub: "BRIGHTWATER DENTAL GROUP  /  DEPLOYMENTS AND BILLING  /  STAGE 5 OF 5", right: D.seg(["Deployments", "Billing"], 0) + `<span class="pill">Contract signed Oct 28</span>` });
a.innerHTML = s.open + `<div class="grid g">
 ${D.spine(4)}
 <section class="t t--blue cv">
   <div class="o">Contract value</div>
   <div class="d-xl num">$464K</div>
   <div class="cap">$12,910 a month, 36 months, three providers.</div>
   <div class="sp1"></div>
   <div style="display:grid;gap:10px">${[["Northline", 4820, 100], ["Kestrel", 4310, 89], ["Meridian", 3780, 78]].map(([n, v, w]) => `<div style="display:grid;grid-template-columns:78px 1fr 56px;gap:10px;align-items:center;font:600 12px/1 var(--ns-font-sans)"><span>${n}</span><div class="bar"><i style="--_v:${w}%;--_c:#fff"></i></div><span class="num" style="text-align:right">$${(v / 1000).toFixed(1)}K</span></div>`).join("")}</div>
   <div class="ls" style="--cols:1fr auto"><div><span class="k">Term starts</span><b class="num">Dec 1</b></div><div><span class="k">Term ends</span><b class="num">Nov 30, 2029</b></div></div>
 </section>

 <section class="t sl">
   <div class="o">Sites live</div>
   <div class="row" style="flex:1;gap:18px">${D.ring({ size: 132, stroke: 15, pct: 0, label: "0 / 14", fs: 22, color: "var(--ns-teal-500)" })}<div style="display:grid;gap:8px"><span class="cap">First installs Nov 12.</span><span class="cap">All sites live by Feb 20.</span></div></div>
   <hr class="hr"><div style="display:grid;gap:9px">${[["Northline", "0 of 9", "var(--ns-teal-500)"], ["Kestrel", "0 of 14", "var(--ns-viz-4)"], ["Meridian", "0 of 14", "var(--ns-viz-2)"]].map(([n, v, c]) => `<div class="row sb" style="font:600 13px/1 var(--ns-font-sans)"><span class="row" style="gap:8px"><i class="dot" style="--_c:${c}"></i>${n}</span><span class="num" style="color:var(--ns-text-secondary);font-weight:400">${v}</span></div>`).join("")}</div>
 </section>

 <section class="t t--teal bl">
   <div class="o">Billing starts</div>
   <div class="d-xl num">Dec 1</div>
   <div class="sp1"></div>
   <div class="ls" style="--cols:1fr auto"><div><span class="k">Dec</span><b class="num">$3.8K</b></div><div><span class="k">Jan</span><b class="num">$7.9K</b></div><div><span class="k">Feb, all sites live</span><b class="num">$12.9K</b></div></div>
   <div class="cap">Billed as each site goes live.</div>
 </section>

 <section class="t dp">
   <div class="o">Deployment plan <em>Order, install, test, live</em></div>
   <div class="sp1" style="display:grid;align-content:center">
     <div class="gt"><div></div>${["NOV", "DEC", "JAN", "FEB"].map(m => `<div class="m">${m}</div>`).join("")}</div>
     ${[["Northline, fiber", [[0, 12, "var(--ns-viz-5)"], [12, 30, "var(--ns-viz-4)"], [42, 12, "var(--ns-viz-2)"], [54, 4, "var(--ns-teal-500)"]]], ["Kestrel, SD-WAN", [[8, 10, "var(--ns-viz-5)"], [18, 32, "var(--ns-viz-4)"], [50, 14, "var(--ns-viz-2)"], [64, 4, "var(--ns-teal-500)"]]], ["Meridian, voice", [[22, 8, "var(--ns-viz-5)"], [30, 30, "var(--ns-viz-4)"], [60, 16, "var(--ns-viz-2)"], [76, 4, "var(--ns-teal-500)"]]], ["Training", [[70, 24, "var(--ns-viz-3)"]]]].map(([n, segs]) => `<div class="gt"><div class="n">${n}</div><div class="l">${segs.map(([st, w, c]) => `<i style="--_c:${c};--_s:${st}%;--_w:${w}%"></i>`).join("")}</div></div>`).join("")}
   </div>
   <div class="lg"><span><i style="--_c:var(--ns-viz-5)"></i>Order</span><span><i style="--_c:var(--ns-viz-4)"></i>Install</span><span><i style="--_c:var(--ns-viz-2)"></i>Test</span><span><i style="--_c:var(--ns-teal-500)"></i>Live</span></div>
 </section>

 <section class="t rm">
   <div class="o">Monthly billing ramp <em>$K, by provider</em></div>
   <div class="sp1" style="display:flex;align-items:flex-end">${D.stack({ w: 380, h: 180, gap: 12, labels: ["Dec", "Jan", "Feb", "Mar"], sets: [{ data: [1.7, 3.2, 4.8, 4.8], color: "var(--ns-chart-series-1)" }, { data: [1.2, 2.6, 4.3, 4.3], color: "var(--ns-chart-series-2)" }, { data: [0.9, 2.1, 3.8, 3.8], color: "var(--ns-chart-series-3)" }] })}</div>
   <div class="lg"><span><i style="--_c:var(--ns-chart-series-1)"></i>Northline</span><span><i style="--_c:var(--ns-chart-series-2)"></i>Kestrel</span><span><i style="--_c:var(--ns-chart-series-3)"></i>Meridian</span></div>
 </section>
 ${D.railPanel()}
</div>` + s.close;

</script>
</body>
</html>
