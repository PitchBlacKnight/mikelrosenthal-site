<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>Editorial stat wall | NorthStar dashboard layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/dashboards.css">
<style>

  .ed { display: grid; grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 30px 48px; padding: 6px 12px 6px; min-height: 0; }
  .ed > * { border-top: 1px solid var(--ns-border-default); padding-top: 16px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .big { grid-row: 1 / 3; border-top: 4px solid var(--ns-teal-500) !important; }
  .big .d-xxl { font-size: 150px; letter-spacing: -8px; line-height: .8; }
  .ed h2 { margin: 0; font: 800 42px/1.04 var(--ns-font-sans); letter-spacing: -1.4px; }
  .ed p { margin: 0; font: 400 15px/23px var(--ns-font-sans); color: var(--ns-text-secondary); max-width: 440px; }
  .ruler { height: 10px; background: var(--ns-widget-track); position: relative; }
  .ruler i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--_v); background: var(--_c); }
  .risks { grid-column: 2 / 4; }
  .rk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; flex: 1; align-items: start; }
  .rk > div { border-top: 1px solid var(--ns-border-default); padding-top: 14px; display: grid; gap: 10px; }
  .rk b { font: 800 64px/.9 var(--ns-font-sans); letter-spacing: -3px; color: var(--ns-teal-500); }
  .rk span { font: 600 17px/24px var(--ns-font-sans); }

</style>
</head>
<body>
<div class="art" id="a"></div>
<script src="../js/dashboards.js"></script>
<script>
const D = NS.dash;

const s = D.shell({ active: "chart", title: "Quarter in Numbers", sub: "A PRINTED STATEMENT FOR THE LEADERSHIP OFFSITE  /  Q3", right: D.seg(["Q1","Q2","Q3"], 2) });
const kpis = [["Net retention", 118, "%", 100, 130, "teal-500"], ["Gross margin", 62.4, "%", 50, 70, "viz-4"], ["Win rate", 34, "%", 20, 50, "viz-2"], ["Cash runway", 31, " mo", 12, 36, "viz-3"]];
a.innerHTML = s.open + `<div class="ed">
  <div class="big">
    <div class="o">Revenue, Q3 FY26</div>
    <div class="d-xxl num">$48.2<span class="u" style="font-size:.3em;letter-spacing:0">M</span></div>
    <div class="row" style="gap:12px"><span class="dl">+11% against plan</span><span class="cap">Plan was $43.4M</span></div>
    <div class="sp1" style="display:flex;align-items:flex-end;margin-top:12px">${D.area({ w: 520, h: 360, ticks: 4, labels: ["Q4 FY25","Q1","Q2","Q3"], fmt: v => "$" + Math.round(v) + "M", sets: [{ data: [30, 33, 38, 41.6, 48.2], color: "var(--ns-teal-500)", sw: 3, glow: true }], min: 20, max: 52 })}</div>
  </div>
  <div>
    <div class="o">Four readings</div>
    <h2>Churn is at a three-year low.</h2>
    <p>Logo churn fell to 1.9 percent. Most of the gain came from accounts that had been at risk in Q1.</p>
    <div class="sp1" style="display:grid;align-content:end;gap:18px">
    ${kpis.map(([n, v, u, lo, hi, c]) => `<div style="display:grid;grid-template-columns:130px 1fr 78px;gap:14px;align-items:center;font:600 13px/1 var(--ns-font-sans)"><span>${n}</span><div class="ruler" style="--_v:${(v - lo) / (hi - lo) * 100}%;--_c:var(--ns-${c})"><i></i></div><span class="num" style="text-align:right;font-size:20px;font-weight:800">${v}${u}</span></div>`).join("")}</div>
  </div>
  <div>
    <div class="o">Where the growth came from</div>
    <h2>Expansion beat new logos.</h2>
    <p>Existing accounts added $3.1M. New logos added $3.9M after a slow August.</p>
    <div class="sp1" style="display:flex;align-items:flex-end">${D.stack({ w: 360, h: 190, gap: 26, labels: ["Q1","Q2","Q3"], sets: [{ data: [10, 12, 14], color: "var(--ns-viz-2)" }, { data: [6, 8, 9.5], color: "var(--ns-viz-1)" }] })}</div>
    <div class="lg"><span><i style="--_c:var(--ns-viz-1)"></i>New logos</span><span><i style="--_c:var(--ns-viz-2)"></i>Expansion</span></div>
  </div>
  <div class="risks">
    <div class="o">Risks, one line each</div>
    <div class="rk">${[["01", "EU hub timing slips one quarter."], ["02", "Two enterprise renewals open in November."], ["03", "Support desk hiring is six roles behind."]].map(([n, t]) => `<div><b>${n}</b><span>${t}</span></div>`).join("")}</div>
    <div class="cap">Source: finance close, Oct 14. Unaudited.</div>
  </div>
</div>` + s.close;

</script>
</body>
</html>
