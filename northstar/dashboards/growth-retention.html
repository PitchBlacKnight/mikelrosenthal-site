<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>Growth and retention | NorthStar dashboard layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/dashboards.css">
<style>
  .art { background: var(--ns-background-secondary); }
  .t--navy { background: var(--ns-navy-900); color: #fff; box-shadow: none; --ink: #fff; --ink2: #ffffffb3; --faint: #ffffff22; --lbl: #ffffffa0; }
  .g { grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(3, 1fr); }
  .wau { grid-column: 1 / 5; grid-row: 1 / 3; } .coh { grid-column: 5 / 13; grid-row: 1 / 3; }
  .onb { grid-column: 1 / 5; } .feat { grid-column: 5 / 8; } .nps { grid-column: 8 / 10; } .stk { grid-column: 10 / 13; }
  .ch { display: grid; grid-template-columns: 76px repeat(12, 1fr); gap: 4px; align-items: stretch; font: 600 11px/1 var(--ns-font-sans); }
  .ch .h { color: var(--ns-widget-muted); font: 700 10px/1 var(--ns-font-sans); letter-spacing: 1px; text-align: center; padding-bottom: 6px; }
  .ch .r { color: var(--ns-text-secondary); display: grid; align-content: center; font-weight: 600; line-height: 1.3; }
  .ch .r small { display: block; font: 400 10px/1 var(--ns-font-mono); color: var(--ns-widget-muted); margin-top: 2px; }
  .ch i { display: grid; place-items: center; height: 37px; border-radius: 6px; font-style: normal; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--ns-blue-500) calc(var(--_o) * 100%), var(--ns-widget-track)); color: var(--_k, #fff); }
  .ch i.e { background: transparent; }
  .fn { display: grid; gap: 10px; flex: 1; align-content: space-around; }
  .fn > div { display: grid; grid-template-columns: 124px 1fr 86px; gap: 10px; align-items: center; font: 600 13px/1 var(--ns-font-sans); }
  .fn .bar { height: 26px; border-radius: 7px; background: var(--ns-widget-track); position: relative; } .fn .bar i { background: var(--ns-blue-500); } .fn .bar b { position: absolute; right: 10px; top: 0; line-height: 26px; font: 700 12px/26px var(--ns-font-sans); color: var(--ns-text-primary); }
</style>
</head>
<body>
<div class="art" id="a"></div>
<script src="../js/dashboards.js"></script>
<script>
const D = NS.dash;
const s = D.shell({ active: "users", title: "Growth and Retention", sub: "FIELDNOTE APP  /  WEB + IOS + ANDROID  /  LAST 12 WEEKS", right: D.seg(["Weekly", "Monthly"], 0) + `<span class="pill">All platforms</span>` });
const labs = ["W01", "W02", "W03", "W04", "W05", "W06", "W07", "W08", "W09", "W10", "W11", "W12"];
const r = D.rng(14); let cohorts = "";
const users = [24.1, 25.8, 27.3, 26.4, 29.9, 31.2, 33.0, 32.1, 35.6, 38.4];
const wk = ["Jul 28", "Aug 4", "Aug 11", "Aug 18", "Aug 25", "Sep 1", "Sep 8", "Sep 15", "Sep 22", "Sep 29"];
for (let c = 0; c < 10; c++) {
  cohorts += `<div class="r">${wk[c]}<small>${users[c]}K</small></div>`;
  for (let w = 0; w < 12; w++) {
    if (w > 11 - c) { cohorts += `<i class="e"></i>`; continue; }
    const v = w === 0 ? 100 : Math.max(8, Math.round(100 * Math.exp(-w * (.17 - c * .004)) * (.58 + .42 * Math.exp(-w * .25)) * (.97 + r() * .06) ));
    cohorts += `<i style="--_o:${Math.min(1, v / 100) .toFixed(2)};--_k:${v < 42 ? "var(--ns-text-primary)" : "#fff"}">${v}${w === 0 ? "" : ""}</i>`;
  }
}
a.innerHTML = s.open + `<div class="grid g">

 <section class="t t--navy wau">
   <div class="o">Weekly active users</div>
   <div class="d-xxl num">1.28<span class="u">M</span></div>
   <div class="row" style="gap:12px"><span class="dl">9.4% vs 4 wks ago</span><span class="cap">Record week, set Oct 13.</span></div>
   <div class="sp1" style="display:flex;align-items:flex-end">${D.stack({ w: 420, h: 330, gap: 7, r: 4, labels: ["W1","W2","W3","W4","W5","W6","W7","W8","W9","W10","W11","W12"], labelFill: "#ffffffa8", sets: [{ data: [62,64,66,65,68,70,71,73,75,77,80,82], color: "var(--ns-teal-500)" }, { data: [28,30,31,31,33,34,36,37,38,40,41,43], color: "var(--ns-blue-500)" }, { data: [12,13,12,14,15,15,16,16,18,19,19,21], color: "var(--ns-purple-500)" }] })}</div>
   <div class="lg"><span><i style="--_c:var(--ns-teal-500)"></i>Retained</span><span><i style="--_c:var(--ns-blue-500)"></i>New</span><span><i style="--_c:var(--ns-purple-500)"></i>Resurrected</span></div>
 </section>

 <section class="t coh">
   <div class="o">Retention by weekly cohort <em>% of cohort still active</em></div>
   <div class="row sb row--b"><div class="row row--b" style="gap:14px"><div class="d-lg num">38%</div><span class="cap" style="padding-bottom:6px">Week 4 retention, up from 31% in July.</span></div>
     <div class="lg"><span>Low</span><span style="display:inline-flex;gap:2px">${[.1,.3,.5,.7,.9].map(o => `<i style="width:18px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--ns-blue-500) ${o * 100}%,var(--ns-widget-track))"></i>`).join("")}</span><span>High</span></div></div>
   <div class="sp1" style="display:grid;align-content:center"><div class="ch"><div></div>${labs.map((l, i) => `<div class="h">${i === 0 ? "WK 0" : "WK " + i}</div>`).join("")}${cohorts}</div></div>
 </section>

 <section class="t onb">
   <div class="o">Onboarding funnel <em>New signups</em></div>
   <div class="fn">${[["Created account", 100, "38.4K"], ["Verified email", 88, "33.8K"], ["Created first note", 68, "27.3K"], ["Invited a teammate", 38, "14.6K"], ["Active on day 7", 29, "11.1K"]].map(([l, p, v]) => `<div><span>${l}</span><div class="bar"><i style="--_v:${p}%"></i></div><b class="num" style="text-align:right;font-weight:700">${v} <span style="color:var(--ns-text-secondary);font-weight:400">${p}%</span></b></div>`).join("")}</div>
 </section>

 <section class="t feat">
   <div class="o">Feature adoption <em>% of WAU</em></div>
   <div style="display:grid;gap:13px;margin-top:4px;flex:1;align-content:space-around">${[["Notes", 94, "viz-4"], ["Search", 77, "viz-1"], ["Shared boards", 52, "viz-2"], ["Templates", 41, "viz-3"], ["AI summaries", 33, "viz-6"]].map(([n, v, c]) => `<div style="display:grid;gap:7px"><div class="row sb" style="font:600 13px/1 var(--ns-font-sans)"><span>${n}</span><span class="num">${v}%</span></div><div class="bar" style="height:8px"><i style="--_v:${v}%;--_c:var(--ns-${c})"></i></div></div>`).join("")}</div>
 </section>

 <section class="t t--teal nps">
   <div class="o">NPS</div>
   <div class="d-xxl num">+54</div>
   <div class="sp1"></div>
   <div class="ls" style="--cols:1fr auto"><div><span class="k">Promoters</span><b class="num">66%</b></div><div><span class="k">Detractors</span><b class="num">12%</b></div></div>
   <div class="cap">2,184 responses this quarter.</div>
 </section>

 <section class="t stk">
   <div class="o">Stickiness</div>
   <div class="row" style="gap:16px;flex:1;justify-content:space-around">
     <figure style="margin:0;display:grid;gap:8px;justify-items:center">${D.ring({ size: 140, stroke: 15, pct: 41, color: "var(--ns-blue-500)", label: "41%", fs: 24 })}<figcaption class="cap">DAU / MAU</figcaption></figure>
     <figure style="margin:0;display:grid;gap:8px;justify-items:center">${D.ring({ size: 140, stroke: 15, pct: 68, color: "var(--ns-purple-500)", label: "68%", fs: 24 })}<figcaption class="cap">WAU / MAU</figcaption></figure>
   </div>
 </section>

</div>` + s.close;
</script>
</body>
</html>
