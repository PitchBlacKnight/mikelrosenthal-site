<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>Milestone spine | NorthStar dashboard layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/dashboards.css">
<style>

  .sp16 { display: grid; grid-template-columns: 1fr 360px; gap: 22px; min-height: 0; }
  .track { position: relative; padding-left: 112px; display: grid; grid-auto-rows: 1fr; gap: 14px; min-height: 0; }
  .track::before { content: ""; position: absolute; left: 80px; top: 30px; bottom: 30px; width: 3px; background: linear-gradient(var(--ns-teal-500), var(--ns-blue-500), var(--ns-purple-500)); border-radius: 3px; }
  .ms { position: relative; display: grid; grid-template-columns: 1fr 170px; gap: 14px; align-items: stretch; min-height: 0; }
  .ms::before { content: attr(data-d); position: absolute; left: -112px; width: 62px; top: 50%; transform: translateY(-50%); font: 700 12px/1 var(--ns-font-mono); color: var(--ns-text-secondary); text-align: right; }
  .ms::after { content: ""; position: absolute; left: -40px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); border-radius: 50%; background: var(--_c); box-shadow: 0 0 0 5px var(--ns-background-primary); }
  .ms .card { padding: 14px 20px; border-radius: 14px; background: var(--ns-widget-bg); box-shadow: var(--ns-widget-shadow); display: grid; gap: 6px; align-content: center; }
  .ms .card h3 { margin: 0; font: 700 18px/24px var(--ns-font-sans); }
  .ms .card p { margin: 0; font: 400 13px/19px var(--ns-font-sans); color: var(--ns-widget-muted); }
  .ms .metric { border-radius: 14px; background: var(--ns-widget-inset); display: grid; align-content: center; gap: 12px; padding: 14px 18px; }
  .ms.done .card { box-shadow: inset 0 0 0 1px var(--_c); }
  .strip { display: grid; grid-template-rows: 1.5fr 1fr 1fr; gap: 14px; min-height: 0; }

</style>
</head>
<body>
<div class="art" id="a"></div>
<script src="../js/dashboards.js"></script>
<script>
const D = NS.dash;

const s = D.shell({ active: "target", title: "Launch Milestones", sub: "CONSUMER BRAND  /  FALL CAMPAIGN  /  OCT 2026 TO MAR 2027", right: D.seg(["Plan", "Actual"], 0) + D.live("Week 42") });
const ms = [["Sep 8", "Brief locked", "Scope, budget and KPI set with the client.", "var(--ns-teal-500)", "done", ["On plan", "100%"]], ["Oct 6", "Concepts approved", "Three routes narrowed to one. Route B picked.", "var(--ns-teal-500)", "done", ["3 days late", "100%"]], ["Oct 27", "Production complete", "Film, stills and cutdowns delivered.", "var(--ns-blue-500)", "", ["In progress", "72%"]], ["Nov 14", "Media flight starts", "Paid social first, then search and CTV.", "var(--ns-purple-500)", "", ["Booked", "58%"]], ["Dec 1", "Holiday push", "Gift guide and retail partner placements.", "var(--ns-viz-3)", "", ["Forecast", "31%"]], ["Jan 15", "Post-campaign review", "Readout to the board with lift study.", "var(--ns-viz-5)", "", ["Not started", "0%"]]];
a.innerHTML = s.open + `<div class="sp16">
  <div class="track">${ms.map(([d, t, p, c, st, [status, pct]]) => `<div class="ms ${st}" data-d="${d}" style="--_c:${c}"><div class="card" style="--_c:${c}"><div class="row sb"><span class="tag" style="color:${c};background:color-mix(in srgb, ${c} 16%, transparent)">${status}</span><span class="cap">${pct} complete</span></div><h3>${t}</h3><p>${p}</p></div><div class="metric"><div class="d-md num" style="color:${c}">${pct}</div><div style="width:100%">${D.bullet({ pct: parseInt(pct), target: 100, color: c, h: 8 })}</div></div></div>`).join("")}</div>
  <div class="strip">
    <section class="t"><div class="o">Spend, by month <em>$K</em></div>
      <div class="sp1" style="display:flex;align-items:flex-end">${D.bars({ w: 312, h: 190, data: [120, 240, 310, 280, 190, 40], color: "var(--ns-widget-track)", hi: 2, hiColor: "var(--ns-teal-500)", gap: 8, r: 4, labels: ["Sep","Oct","Nov","Dec","Jan","Feb"], track: true, vmax: 340 })}</div>
    </section>
    <section class="t t--teal"><div class="o">Days to next milestone</div><div class="d-xxl num" style="font-size:96px">22</div><div class="cap">Media flight, Nov 14. Creative is locked.</div></section>
    <section class="t"><div class="o">Budget used</div><div class="row" style="gap:18px;flex:1">${D.ring({ size: 110, stroke: 13, pct: 58, color: "var(--ns-viz-2)", label: "58%", fs: 22 })}<div class="cap">$1.16M of $2.0M committed</div></div></section>
  </div>
</div>` + s.close;

</script>
</body>
</html>
