<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<title>Settings form</title>
<meta name="description" content="A single-column settings form with an error summary, fields with helpers and one error, checkboxes, a switch and form actions.">
<script src="../../js/ns-behavior.js" defer></script>
</head>
<body class="ns-body">
<div class="ns-app">
<nav class="ns-app__nav" aria-label="App"><div class="ns-sidenav"><div class="ns-sidenav__group">Operate</div><a href="#">Dashboard</a><a href="#">Accounts <span class="ns-count">3</span></a><a href="#">Approvals</a><div class="ns-sidenav__group">Configure</div><a href="#">Integrations</a><a href="#" aria-current="page">Settings</a></div></nav>
<main class="ns-app__main">
  <header class="ns-page-head">
    <div class="ns-page-head__text"><p class="ns-page-head__eyebrow">Settings</p><h1 class="ns-page-head__title">Workspace</h1><p class="ns-page-head__desc">Changes apply to everyone in the workspace.</p></div>
  </header>
  <form class="ns-stack" novalidate>
    <div class="ns-alert ns-alert--error" role="alert"><span class="ns-alert__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16v-4M12 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span><div><p class="ns-alert__title">Fix 1 field before saving</p><ul class="ns-alert__desc"><li><a class="ns-link" href="#ws-slug">Workspace URL is taken</a></li></ul></div></div>
    <div class="ns-field"><label class="ns-label" for="ws-name">Workspace name</label><input class="ns-input" id="ws-name" value="Acme Operations" aria-describedby="ws-name-h"><span class="ns-helper" id="ws-name-h">Shown in the header and in invites.</span></div>
    <div class="ns-field is-error"><label class="ns-label" for="ws-slug">Workspace URL</label><input class="ns-input" id="ws-slug" value="acme" aria-invalid="true" aria-describedby="ws-slug-h"><span class="ns-helper" id="ws-slug-h">Workspace URL is taken. Try acme-ops.</span></div>
    <div class="ns-field"><label class="ns-label" for="ws-region">Data region</label><select class="ns-select" id="ws-region"><option>us-east-1</option><option>eu-central-1</option></select></div>
    <div class="ns-field"><label class="ns-label" for="ws-about">Description</label><textarea class="ns-textarea" id="ws-about" maxlength="280"></textarea><span class="ns-helper">0 / 280</span></div>
    <fieldset class="ns-stack ns-stack--sm"><legend class="ns-label">Alert channels</legend><label class="ns-check"><input type="checkbox" checked> Email</label><label class="ns-check"><input type="checkbox"> Slack</label></fieldset>
    <label class="ns-toggle"><input type="checkbox" role="switch" checked> Require two-step sign-in</label>
    <div class="ns-cluster ns-cluster--center"><button class="ns-btn" type="submit">Save changes</button><button class="ns-btn ns-btn--tertiary" type="button">Cancel</button></div>
  </form>
</main>
</div>
</body>
</html>
